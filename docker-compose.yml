services:
  mysql:
    image: mysql:8.0
    container_name: nowinwiki-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nowinwiki
    ports:
      - "3307:3306"
    volumes:
      - nowinwiki-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: nowinwiki-redis
    ports:
      - "6379:6379"

volumes:
  nowinwiki-mysql-data:
